name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the Poetry release that produced the current lock-version 2.0
  # lock file, so `poetry check --lock` compares like for like.
  POETRY_VERSION: "1.8.5"

jobs:
  # Guards against a poetry.lock that drifted from pyproject.toml — the failure
  # mode a dependency-bump PR is most likely to introduce.
  lock:
    name: Lock file consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Check pyproject.toml and poetry.lock agree
        run: poetry check --lock

  # Fast feedback: unit tests carry no model downloads, so they run on every
  # supported interpreter.
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Run unit tests
        run: poetry run pytest tests/ -v --no-cov

  # Speech recognition end to end. Isolated from the unit job because it pulls
  # ~1.6 GB of Whisper weights; the cache keeps repeat runs cheap.
  bdd:
    name: BDD suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Cache Hugging Face model weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-whisper-large-v3-turbo

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      # The YouTube download scenario is left out here rather than skipped
      # quietly: YouTube answers datacenter addresses with a bot challenge, so
      # it can only fail on a hosted runner. It still runs from a workstation,
      # where the address is residential.
      - name: Run BDD suite (YouTube download scenario deselected)
        run: |
          echo "Deselected: -m 'not youtube' — scenarios downloading from YouTube, which refuses datacenter addresses."
          poetry run pytest features/ -v -m "not youtube"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
