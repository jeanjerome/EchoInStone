[tool.poetry]
name = "EchoInStone"
version = "1.0.0"
description = "A tool to extract and transcribe audio."
authors = ["Jean-Jerome Levy"]
packages = [
    { include = "EchoInStone" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
yt-dlp = "^2026.7.4"
feedparser = "^6.0.11"
requests = "^2.32.4"
transformers = "^5.5.0"
torch = "^2.8.0"
pyannote-audio = "^4.0.7"
accelerate = "^1.3.0"
jinja2 = "^3.1.6"
yt-dlp-ejs = "^0.8.0"

[tool.poetry.group.dev.dependencies]
pytest-bdd = "^8.1.0"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
echotranscriber = "main:main"
