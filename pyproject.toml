[tool.poetry]
name = "EchoInStone"
version = "0.9.0"
description = "A tool to extract and transcribe audio."
authors = ["Jean-Jerome Levy"]
packages = [
    { include = "EchoInStone" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pytubefix = "^8.12.1"
feedparser = "^6.0.11"
requests = "^2.32.4"
transformers = "^5.5.0"
torch = "^2.8.0"
pyannote-audio = "^4.0.7"
pydub = "^0.25.1"
accelerate = "^1.3.0"
jinja2 = "^3.1.6"

[tool.poetry.group.dev.dependencies]
pytest-bdd = "^8.1.0"
pytest-cov = ">=6,<8"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
echotranscriber = "main:main"
